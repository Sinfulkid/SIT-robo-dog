<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unitree Go2 Mission Control</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-color: #1a1f26;
            --accent-color: #00ff66;
            --text-color: #ffffff;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: var(--accent-color); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
        .dashboard { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; width: 90%; max-width: 1200px; margin-top: 20px; }
        .panel { background: var(--card-color); border: 1px solid #2d3748; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .video-feed { width: 100%; height: auto; border-radius: 8px; border: 2px solid #2d3748; display: block; background: #000; }
        .controls-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .btn { background: #2d3748; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: all 0.2s; text-transform: uppercase; }
        .btn:hover { background: var(--accent-color); color: #000; transform: translateY(-2px); }
        .btn-stop { background: #e53e3e; }
        .btn-stop:hover { background: #fc8181; color: white; }
        .telemetry-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2d3748; font-size: 14px; }
        .telemetry-val { color: var(--accent-color); font-family: monospace; }
    </style>
</head>
<body>

    <h1>Unitree Go2 Control Dashboard</h1>
    <p>System Connection: <span style="color: var(--accent-color); font-weight: bold;">ONLINE</span></p>

    <div class="dashboard">
        <!-- LEFT PANEL: Visual Feed -->
        <div class="panel">
            <h2 style="margin-top:0;">🎥 Primary Camera Stream</h2>
            <img class="video-feed" src="/video_feed" alt="Go2 Camera Feed" />
        </div>

        <!-- RIGHT PANEL: Controls & Telemetry Data -->
        <div class="panel">
            <h2 style="margin-top:0;">🕹️ Robot Diagnostics</h2>
            
            <!-- Telemetry Status Placeholders -->
            <div class="telemetry-item"><span>Battery Charge</span><span class="telemetry-val">84%</span></div>
            <div class="telemetry-item"><span>Locomotion Mode</span><span class="telemetry-val">Stand / Walk</span></div>
            <div class="telemetry-item"><span>Network Latency</span><span class="telemetry-val">4ms</span></div>

            <h3 style="margin-top:25px;">⚡ Command Shortcuts</h3>
            <div class="controls-grid">
                <button class="btn" onclick="sendCommand('stand')">Stand Up</button>
                <button class="btn" onclick="sendCommand('sit')">Sit Down</button>
                <button class="btn" onclick="sendCommand('dance')">Dance Mode</button>
                <button class="btn btn-stop" onclick="sendCommand('stop')">Emergency Stop</button>
            </div>
        </div>
    </div>

    <script>
        // Simple JavaScript helper to shoot command paths back to your Python script instantly
        function sendCommand(action) {
            console.log("Executing Action:", action);
            fetch('/api/command/' + action)
                .then(response => response.json())
                .then(data => alert("Robot Response: " + data.status))
                .catch(err => console.error("Action execution failed:", err));
        }
    </script>
</body>
</html>
