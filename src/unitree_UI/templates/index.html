<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unitree Go2 Live Vision & SLAM</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-color: #1a1f26;
            --accent-color: #00ff66;
            --text-color: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .dashboard {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 20px;
            width: 95%;
            max-width: 1400px;
            margin-top: 20px;
        }
        .panel {
            background: var(--card-color);
            border: 1px solid #2d3748;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .panel h2 {
            margin-top: 0;
            font-size: 18px;
        }
        .feed-box {
            width: 100%;
            height: auto;
            border-radius: 8px;
            border: 2px solid #2d3748;
            display: block;
            background: #000;
        }
        @media (max-width: 900px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <h1>Unitree Go2 Vision & SLAM</h1>
    <p>System Connection: <span style="color: var(--accent-color); font-weight: bold;">ONLINE</span></p>

    <div class="dashboard">
        <!-- LEFT PANEL: Camera Stream -->
        <div class="panel">
            <h2>🎥 Primary Camera Stream</h2>
            <img class="feed-box" src="/video_feed" alt="Go2 Camera Feed" />
        </div>

        <!-- RIGHT PANEL: Live SLAM / LiDAR Environment -->
        <div class="panel">
            <h2>🧭 Live SLAM Environment (LiDAR)</h2>
            <img class="feed-box" src="/slam_feed" alt="Go2 SLAM Map" />
        </div>
    </div>

</body>
</html>
